
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-sans); background: transparent; }

  .board-root { display: flex; flex-direction: column; height: 100vh; min-height: 580px; user-select: none; }

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px; background: var(--color-background-secondary);
    border-bottom: 0.5px solid var(--color-border-tertiary); flex-shrink: 0;
  }
  .topbar-left { display: flex; align-items: center; gap: 10px; }
  .board-title { font-size: 15px; font-weight: 500; color: var(--color-text-primary); }
  .board-badge { font-size: 11px; padding: 2px 8px; border-radius: 20px; background: var(--color-background-info); color: var(--color-text-info); }
  .topbar-right { display: flex; gap: 8px; }
  .btn-sm {
    font-size: 12px; padding: 5px 12px; border-radius: var(--border-radius-md);
    border: 0.5px solid var(--color-border-secondary); background: transparent;
    color: var(--color-text-primary); cursor: pointer; display: flex; align-items: center; gap: 5px;
    transition: background 0.15s;
  }
  .btn-sm:hover { background: var(--color-background-secondary); }
  .btn-primary {
    background: var(--color-text-primary); color: var(--color-background-primary);
    border-color: transparent;
  }
  .btn-primary:hover { opacity: 0.85; background: var(--color-text-primary); }

  .board-scroll {
    display: flex; gap: 12px; padding: 14px 16px; overflow-x: auto; overflow-y: hidden;
    flex: 1; align-items: flex-start;
  }
  .board-scroll::-webkit-scrollbar { height: 5px; }
  .board-scroll::-webkit-scrollbar-track { background: transparent; }
  .board-scroll::-webkit-scrollbar-thumb { background: var(--color-border-secondary); border-radius: 99px; }

  .list {
    flex-shrink: 0; width: 240px; background: var(--color-background-secondary);
    border-radius: var(--border-radius-lg); border: 0.5px solid var(--color-border-tertiary);
    display: flex; flex-direction: column; max-height: 100%; transition: opacity 0.15s, box-shadow 0.15s;
  }
  .list.dragging-list { opacity: 0.45; box-shadow: none; }
  .list.list-drag-over { box-shadow: 0 0 0 2px var(--color-border-info); }

  .list-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 12px 8px; cursor: grab; flex-shrink: 0;
  }
  .list-header:active { cursor: grabbing; }
  .list-title { font-size: 13px; font-weight: 500; color: var(--color-text-primary); flex: 1; }
  .list-title-input {
    font-size: 13px; font-weight: 500; background: transparent;
    border: 0.5px solid var(--color-border-primary); border-radius: var(--border-radius-md);
    color: var(--color-text-primary); padding: 2px 6px; width: 100%; outline: none;
  }
  .list-count {
    font-size: 11px; color: var(--color-text-secondary); background: var(--color-background-primary);
    border: 0.5px solid var(--color-border-tertiary); border-radius: 99px;
    padding: 1px 7px; margin-right: 4px;
  }
  .list-menu-btn {
    background: none; border: none; cursor: pointer; color: var(--color-text-secondary);
    padding: 2px 4px; border-radius: var(--border-radius-md); font-size: 16px; line-height: 1;
    transition: background 0.12s;
  }
  .list-menu-btn:hover { background: var(--color-background-primary); }

  .cards-area {
    padding: 0 8px 8px; overflow-y: auto; flex: 1; min-height: 40px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .cards-area::-webkit-scrollbar { width: 3px; }
  .cards-area::-webkit-scrollbar-thumb { background: var(--color-border-secondary); border-radius: 99px; }

  .card {
    background: var(--color-background-primary); border-radius: var(--border-radius-md);
    border: 0.5px solid var(--color-border-tertiary); padding: 8px 10px;
    cursor: grab; transition: box-shadow 0.12s, opacity 0.12s, transform 0.12s;
    position: relative;
  }
  .card:hover { box-shadow: 0 1px 4px rgba(0,0,0,0.08); border-color: var(--color-border-secondary); }
  .card:active { cursor: grabbing; }
  .card.dragging { opacity: 0.35; transform: rotate(1.5deg); }
  .card.card-drag-over-top { border-top: 2px solid #378ADD; }
  .card.card-drag-over-bottom { border-bottom: 2px solid #378ADD; }

  .card-labels { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
  .label-pill {
    height: 7px; border-radius: 99px; min-width: 28px; display: inline-block; cursor: pointer;
    transition: filter 0.12s;
  }
  .label-pill:hover { filter: brightness(0.88); }
  .label-pill.lg { height: 20px; min-width: 52px; padding: 0 8px; font-size: 10px; font-weight: 500;
    display: flex; align-items: center; color: rgba(255,255,255,0.95); }

  .card-title { font-size: 13px; color: var(--color-text-primary); line-height: 1.4; }
  .card-title-input {
    font-size: 13px; color: var(--color-text-primary); background: transparent;
    border: none; outline: none; width: 100%; resize: none; font-family: inherit;
    line-height: 1.4; min-height: 40px;
  }
  .card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
  .card-due { font-size: 11px; color: var(--color-text-secondary); display: flex; align-items: center; gap: 3px; }
  .card-actions { display: flex; gap: 2px; opacity: 0; transition: opacity 0.12s; }
  .card:hover .card-actions { opacity: 1; }
  .card-btn {
    background: none; border: none; cursor: pointer; color: var(--color-text-secondary);
    padding: 3px; border-radius: 4px; font-size: 14px; transition: background 0.1s, color 0.1s;
  }
  .card-btn:hover { background: var(--color-background-secondary); color: var(--color-text-primary); }

  .add-card-btn {
    margin: 0 8px 8px; padding: 6px 8px; border-radius: var(--border-radius-md);
    border: 0.5px dashed var(--color-border-secondary); background: transparent;
    color: var(--color-text-secondary); font-size: 12px; cursor: pointer;
    text-align: left; display: flex; align-items: center; gap: 6px;
    transition: background 0.12s, color 0.12s; flex-shrink: 0;
  }
  .add-card-btn:hover { background: var(--color-background-primary); color: var(--color-text-primary); }

  .add-list-btn {
    flex-shrink: 0; width: 200px; height: 42px; border-radius: var(--border-radius-lg);
    border: 0.5px dashed var(--color-border-secondary); background: transparent;
    color: var(--color-text-secondary); font-size: 13px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    transition: background 0.12s, color 0.12s; align-self: flex-start;
  }
  .add-list-btn:hover { background: var(--color-background-secondary); color: var(--color-text-primary); }

  .drop-placeholder {
    border-radius: var(--border-radius-md); border: 1.5px dashed var(--color-border-info);
    background: var(--color-background-info); min-height: 40px; flex-shrink: 0;
    opacity: 0.5;
  }

  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.38); z-index: 200;
    display: flex; align-items: center; justify-content: center;
  }
  .modal {
    background: var(--color-background-primary); border-radius: var(--border-radius-lg);
    border: 0.5px solid var(--color-border-tertiary); padding: 20px 22px;
    width: 340px; max-width: 95vw; position: relative;
  }
  .modal-title { font-size: 14px; font-weight: 500; margin-bottom: 14px; color: var(--color-text-primary); }
  .modal-close {
    position: absolute; top: 14px; right: 14px; background: none; border: none;
    cursor: pointer; font-size: 18px; color: var(--color-text-secondary);
    line-height: 1; padding: 2px 5px; border-radius: 4px;
  }
  .modal-close:hover { background: var(--color-background-secondary); }
  .modal-section { margin-bottom: 14px; }
  .modal-label { font-size: 11px; color: var(--color-text-secondary); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.04em; }
  .modal-input {
    width: 100%; padding: 7px 10px; border-radius: var(--border-radius-md);
    border: 0.5px solid var(--color-border-primary); background: var(--color-background-primary);
    color: var(--color-text-primary); font-size: 13px; outline: none;
  }
  .modal-input:focus { border-color: var(--color-border-info); }
  .labels-grid { display: flex; flex-wrap: wrap; gap: 6px; }
  .label-option {
    padding: 5px 12px; border-radius: 99px; font-size: 11px; font-weight: 500;
    cursor: pointer; color: rgba(255,255,255,0.95); transition: transform 0.1s, box-shadow 0.1s;
    display: flex; align-items: center; gap: 5px;
  }
  .label-option:hover { transform: scale(1.06); }
  .label-option.selected { box-shadow: 0 0 0 2.5px var(--color-background-primary), 0 0 0 4px currentColor; }
  .modal-footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  .btn-danger {
    font-size: 12px; padding: 6px 12px; border-radius: var(--border-radius-md);
    border: 0.5px solid var(--color-border-danger); background: transparent;
    color: var(--color-text-danger); cursor: pointer;
  }
  .btn-danger:hover { background: var(--color-background-danger); }

  .list-ghost {
    flex-shrink: 0; width: 240px; border-radius: var(--border-radius-lg);
    border: 1.5px dashed var(--color-border-info); background: var(--color-background-info);
    min-height: 60px; opacity: 0.4;
  }
</style>

<div class="board-root">
  <div class="topbar">
    <div class="topbar-left">
      <span style="font-size:18px;" aria-hidden="true"><i class="ti ti-layout-kanban"></i></span>
      <span class="board-title" id="boardTitle">My Project</span>
      <span class="board-badge" id="boardBadge">0 cards</span>
    </div>
    <div class="topbar-right">
      <button class="btn-sm" onclick="sendPrompt('How can I organize my project board better?')">
        <i class="ti ti-sparkles" aria-hidden="true"></i> Get suggestions ↗
      </button>
    </div>
  </div>

  <div class="board-scroll" id="boardScroll"></div>
</div>

<div id="modalContainer"></div>

<script>
const COLORS = [
  { id:'red',    hex:'#E24B4A', name:'Urgent' },
  { id:'amber',  hex:'#EF9F27', name:'In review' },
  { id:'green',  hex:'#63991A', name:'Done' },
  { id:'blue',   hex:'#378ADD', name:'In progress' },
  { id:'purple', hex:'#7F77DD', name:'Design' },
  { id:'teal',   hex:'#1D9E75', name:'Dev' },
  { id:'pink',   hex:'#D4537E', name:'Blocked' },
  { id:'coral',  hex:'#D85A30', name:'Bug' },
];

let state = {
  lists: [
    {
      id:'l1', title:'Backlog',
      cards:[
        { id:'c1', title:'Research competitor features', labels:['purple'], due:'' },
        { id:'c2', title:'Define MVP scope', labels:['blue'], due:'' },
        { id:'c3', title:'Set up design system', labels:['purple','teal'], due:'' },
      ]
    },
    {
      id:'l2', title:'In Progress',
      cards:[
        { id:'c4', title:'Build authentication flow', labels:['blue','teal'], due:'' },
        { id:'c5', title:'Fix login page crash on mobile', labels:['red','coral'], due:'' },
        { id:'c6', title:'API integration for dashboard', labels:['teal'], due:'' },
      ]
    },
    {
      id:'l3', title:'Review',
      cards:[
        { id:'c7', title:'QA onboarding screens', labels:['amber'], due:'' },
        { id:'c8', title:'Code review: payment module', labels:['amber','purple'], due:'' },
      ]
    },
    {
      id:'l4', title:'Done',
      cards:[
        { id:'c9', title:'Project kickoff meeting', labels:['green'], due:'' },
        { id:'c10', title:'Setup CI/CD pipeline', labels:['green','teal'], due:'' },
      ]
    },
  ]
};

let dragCard = null, dragCardListId = null, dragCardOrigIdx = null;
let dragList = null, dragListOrigIdx = null;
let hoverListId = null, hoverCardIdx = null, hoverCardPos = null;
let editingCardId = null;

function uid() { return 'x' + Math.random().toString(36).slice(2,8); }

function totalCards() { return state.lists.reduce((a,l)=>a+l.cards.length,0); }

function colorFor(id) { return COLORS.find(c=>c.id===id) || COLORS[0]; }

function render() {
  const scroll = document.getElementById('boardScroll');
  const scrollLeft = scroll.scrollLeft;

  document.getElementById('boardBadge').textContent = totalCards() + ' cards';
  scroll.innerHTML = '';

  state.lists.forEach((list, li) => {
    const listEl = document.createElement('div');
    listEl.className = 'list';
    listEl.dataset.listId = list.id;

    let headerHTML = `<div class="list-header" draggable="true" data-list-drag="${list.id}">
      <div class="list-title" data-edit-list-title="${list.id}" title="Double-click to rename">${list.title}</div>
      <span class="list-count">${list.cards.length}</span>
      <button class="list-menu-btn" data-list-menu="${list.id}" title="List options"><i class="ti ti-dots" aria-hidden="true"></i></button>
    </div>`;

    let cardsHTML = `<div class="cards-area" data-cards-list="${list.id}">`;
    list.cards.forEach((card, ci) => {
      const labelsHTML = card.labels.map(lid => {
        const c = colorFor(lid);
        return `<span class="label-pill" style="background:${c.hex}" data-label-card="${card.id}" title="${c.name}"></span>`;
      }).join('');

      cardsHTML += `<div class="card" draggable="true" data-card-id="${card.id}" data-card-list="${list.id}" data-card-idx="${ci}">
        ${labelsHTML ? `<div class="card-labels">${labelsHTML}</div>` : ''}
        <div class="card-title" data-card-title="${card.id}">${card.title}</div>
        <div class="card-footer">
          <span></span>
          <span class="card-actions">
            <button class="card-btn" data-edit-card="${card.id}" data-edit-list="${list.id}" title="Edit card"><i class="ti ti-pencil" aria-hidden="true"></i></button>
            <button class="card-btn" data-delete-card="${card.id}" data-delete-from="${list.id}" title="Delete card"><i class="ti ti-trash" aria-hidden="true"></i></button>
          </span>
        </div>
      </div>`;
    });
    cardsHTML += '</div>';

    let addBtnHTML = `<button class="add-card-btn" data-add-card="${list.id}"><i class="ti ti-plus" aria-hidden="true"></i> Add card</button>`;

    listEl.innerHTML = headerHTML + cardsHTML + addBtnHTML;
    scroll.appendChild(listEl);
  });

  const addListBtn = document.createElement('button');
  addListBtn.className = 'add-list-btn';
  addListBtn.innerHTML = '<i class="ti ti-plus" aria-hidden="true"></i> Add list';
  addListBtn.addEventListener('click', addList);
  scroll.appendChild(addListBtn);

  scroll.scrollLeft = scrollLeft;
  attachEvents();
}

function attachEvents() {
  document.querySelectorAll('[data-add-card]').forEach(btn => {
    btn.addEventListener('click', e => { addCard(btn.dataset.addCard); });
  });
  document.querySelectorAll('[data-edit-card]').forEach(btn => {
    btn.addEventListener('click', e => { openCardModal(btn.dataset.editCard, btn.dataset.editList); });
  });
  document.querySelectorAll('[data-delete-card]').forEach(btn => {
    btn.addEventListener('click', e => { deleteCard(btn.dataset.deleteCard, btn.dataset.deleteFrom); });
  });
  document.querySelectorAll('[data-label-card]').forEach(pill => {
    pill.addEventListener('click', e => {
      const card = findCard(pill.dataset.labelCard);
      if (card) openCardModal(card.id, findCardListId(card.id));
    });
  });
  document.querySelectorAll('[data-list-menu]').forEach(btn => {
    btn.addEventListener('click', e => { openListMenu(btn.dataset.listMenu, btn); });
  });
  document.querySelectorAll('[data-edit-list-title]').forEach(el => {
    el.addEventListener('dblclick', e => { startEditListTitle(el.dataset.editListTitle, el); });
  });

  attachDragEvents();
}

function startEditListTitle(listId, el) {
  const list = state.lists.find(l=>l.id===listId);
  if (!list) return;
  const input = document.createElement('input');
  input.className = 'list-title-input';
  input.value = list.title;
  el.replaceWith(input);
  input.focus(); input.select();
  const done = () => {
    list.title = input.value.trim() || list.title;
    render();
  };
  input.addEventListener('blur', done);
  input.addEventListener('keydown', e => { if(e.key==='Enter') done(); if(e.key==='Escape') render(); });
}

function openListMenu(listId, anchorBtn) {
  closeModal();
  const list = state.lists.find(l=>l.id===listId);
  const m = document.createElement('div');
  m.style.cssText = 'position:fixed;z-index:300;background:var(--color-background-primary);border:0.5px solid var(--color-border-primary);border-radius:var(--border-radius-md);box-shadow:0 4px 16px rgba(0,0,0,0.12);padding:6px;min-width:160px;';
  const rect = anchorBtn.getBoundingClientRect();
  m.style.top = (rect.bottom+4)+'px';
  m.style.left = rect.left+'px';
  const items = [
    { label: '<i class="ti ti-sort-ascending-letters"></i> Rename list', action: () => { startEditListTitle(listId, document.querySelector(`[data-edit-list-title="${listId}"]`)); }},
    { label: '<i class="ti ti-copy"></i> Duplicate list', action: () => { duplicateList(listId); }},
    { label: '<i class="ti ti-trash" style="color:var(--color-text-danger)"></i> <span style="color:var(--color-text-danger)">Delete list</span>', action: () => { deleteList(listId); }},
  ];
  items.forEach(item => {
    const btn = document.createElement('button');
    btn.style.cssText = 'display:flex;align-items:center;gap:8px;width:100%;padding:7px 10px;border:none;background:transparent;cursor:pointer;font-size:12.5px;color:var(--color-text-primary);border-radius:6px;text-align:left;transition:background 0.1s;';
    btn.innerHTML = item.label;
    btn.onmouseenter = () => btn.style.background='var(--color-background-secondary)';
    btn.onmouseleave = () => btn.style.background='transparent';
    btn.addEventListener('click', () => { m.remove(); item.action(); });
    m.appendChild(btn);
  });
  document.body.appendChild(m);
  setTimeout(() => document.addEventListener('click', function h(e) {
    if (!m.contains(e.target)) { m.remove(); document.removeEventListener('click',h); }
  }), 10);
}

function duplicateList(listId) {
  const list = state.lists.find(l=>l.id===listId);
  if (!list) return;
  const newList = {
    id: uid(), title: list.title + ' (copy)',
    cards: list.cards.map(c=>({ ...c, id: uid() }))
  };
  const idx = state.lists.findIndex(l=>l.id===listId);
  state.lists.splice(idx+1, 0, newList);
  render();
}

function deleteList(listId) {
  state.lists = state.lists.filter(l=>l.id!==listId);
  render();
}

function addList() {
  const newList = { id: uid(), title: 'New list', cards: [] };
  state.lists.push(newList);
  render();
  const scroll = document.getElementById('boardScroll');
  scroll.scrollLeft = scroll.scrollWidth;
  const el = document.querySelector(`[data-edit-list-title="${newList.id}"]`);
  if (el) startEditListTitle(newList.id, el);
}

function addCard(listId) {
  const card = { id: uid(), title: 'New card', labels: [], due: '' };
  const list = state.lists.find(l=>l.id===listId);
  if (list) { list.cards.push(card); render(); openCardModal(card.id, listId); }
}

function deleteCard(cardId, listId) {
  const list = state.lists.find(l=>l.id===listId);
  if (list) { list.cards = list.cards.filter(c=>c.id!==cardId); render(); }
}

function findCard(cardId) {
  for (const l of state.lists) { const c = l.cards.find(c=>c.id===cardId); if(c) return c; }
  return null;
}
function findCardListId(cardId) {
  for (const l of state.lists) { if(l.cards.find(c=>c.id===cardId)) return l.id; }
  return null;
}

function openCardModal(cardId, listId) {
  closeModal();
  const card = findCard(cardId);
  if (!card) return;
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.id = 'mainModal';

  const labelsHTML = COLORS.map(c =>
    `<span class="label-option${card.labels.includes(c.id)?' selected':''}" style="background:${c.hex};color:${c.hex};" data-pick-label="${c.id}">${card.labels.includes(c.id)?'<i class="ti ti-check"></i>':''} ${c.name}</span>`
  ).join('');

  backdrop.innerHTML = `<div class="modal">
    <button class="modal-close" id="closeModal"><i class="ti ti-x" aria-hidden="true"></i></button>
    <div class="modal-title"><i class="ti ti-card-boards" aria-hidden="true" style="margin-right:6px;"></i>Edit card</div>
    <div class="modal-section">
      <div class="modal-label">Title</div>
      <textarea class="modal-input" id="cardTitleInput" rows="2">${card.title}</textarea>
    </div>
    <div class="modal-section">
      <div class="modal-label">Labels</div>
      <div class="labels-grid" id="labelsGrid">${labelsHTML}</div>
    </div>
    <div class="modal-footer">
      <button class="btn-danger" id="deleteCardBtn"><i class="ti ti-trash" aria-hidden="true"></i> Delete</button>
      <button class="btn-sm btn-primary" id="saveCardBtn"><i class="ti ti-check" aria-hidden="true"></i> Save</button>
    </div>
  </div>`;

  document.getElementById('modalContainer').appendChild(backdrop);

  let tempLabels = [...card.labels];

  backdrop.querySelectorAll('[data-pick-label]').forEach(el => {
    el.style.color = 'rgba(255,255,255,0.95)';
    el.addEventListener('click', () => {
      const lid = el.dataset.pickLabel;
      const c = colorFor(lid);
      if (tempLabels.includes(lid)) {
        tempLabels = tempLabels.filter(x=>x!==lid);
        el.classList.remove('selected');
        el.innerHTML = ` ${c.name}`;
      } else {
        tempLabels.push(lid);
        el.classList.add('selected');
        el.innerHTML = `<i class="ti ti-check"></i> ${c.name}`;
      }
    });
  });

  document.getElementById('closeModal').addEventListener('click', closeModal);
  backdrop.addEventListener('click', e => { if(e.target===backdrop) closeModal(); });

  document.getElementById('saveCardBtn').addEventListener('click', () => {
    const t = document.getElementById('cardTitleInput').value.trim();
    if (t) { card.title = t; card.labels = [...tempLabels]; }
    closeModal(); render();
  });
  document.getElementById('deleteCardBtn').addEventListener('click', () => {
    deleteCard(cardId, listId); closeModal();
  });

  document.getElementById('cardTitleInput').focus();
}

function closeModal() {
  const m = document.getElementById('mainModal');
  if (m) m.remove();
}

function attachDragEvents() {
  document.querySelectorAll('.card').forEach(cardEl => {
    cardEl.addEventListener('dragstart', e => {
      dragCard = cardEl.dataset.cardId;
      dragCardListId = cardEl.dataset.cardList;
      dragCardOrigIdx = parseInt(cardEl.dataset.cardIdx);
      dragList = null;
      e.dataTransfer.effectAllowed = 'move';
      setTimeout(() => cardEl.classList.add('dragging'), 0);
    });
    cardEl.addEventListener('dragend', e => {
      cardEl.classList.remove('dragging');
      if (dragCard && hoverListId !== null) {
        moveCard(dragCard, dragCardListId, hoverListId, hoverCardIdx, hoverCardPos);
      }
      dragCard = null; dragCardListId = null; dragCardOrigIdx = null;
      hoverListId = null; hoverCardIdx = null; hoverCardPos = null;
      render();
    });
    cardEl.addEventListener('dragover', e => {
      if (!dragCard) return;
      e.preventDefault(); e.stopPropagation();
      const rect = cardEl.getBoundingClientRect();
      const mid = rect.top + rect.height/2;
      hoverCardPos = e.clientY < mid ? 'top' : 'bottom';
      hoverCardIdx = parseInt(cardEl.dataset.cardIdx);
      hoverListId = cardEl.dataset.cardList;
      document.querySelectorAll('.card').forEach(c => { c.classList.remove('card-drag-over-top','card-drag-over-bottom'); });
      cardEl.classList.add(hoverCardPos==='top'?'card-drag-over-top':'card-drag-over-bottom');
    });
  });

  document.querySelectorAll('.cards-area').forEach(area => {
    area.addEventListener('dragover', e => {
      if (!dragCard) return;
      e.preventDefault();
      const lid = area.dataset.cardsList;
      const list = state.lists.find(l=>l.id===lid);
      if (!list) return;
      hoverListId = lid;
      if (list.cards.length === 0) { hoverCardIdx = 0; hoverCardPos = 'top'; }
    });
  });

  document.querySelectorAll('[data-list-drag]').forEach(header => {
    header.addEventListener('dragstart', e => {
      const listId = header.dataset.listDrag;
      dragList = listId;
      dragListOrigIdx = state.lists.findIndex(l=>l.id===listId);
      dragCard = null;
      e.dataTransfer.effectAllowed = 'move';
      setTimeout(() => { header.closest('.list').classList.add('dragging-list'); }, 0);
    });
    header.addEventListener('dragend', e => {
      document.querySelectorAll('.list').forEach(l=>l.classList.remove('dragging-list','list-drag-over'));
      dragList = null; dragListOrigIdx = null;
      render();
    });
  });

  document.querySelectorAll('.list').forEach(listEl => {
    listEl.addEventListener('dragover', e => {
      if (!dragList) return;
      e.preventDefault();
      const targetId = listEl.dataset.listId;
      if (targetId === dragList) return;
      document.querySelectorAll('.list').forEach(l=>l.classList.remove('list-drag-over'));
      listEl.classList.add('list-drag-over');
      const fromIdx = state.lists.findIndex(l=>l.id===dragList);
      const toIdx = state.lists.findIndex(l=>l.id===targetId);
      if (fromIdx < 0 || toIdx < 0 || fromIdx===toIdx) return;
      const moved = state.lists.splice(fromIdx, 1)[0];
      state.lists.splice(toIdx, 0, moved);
    });
  });
}

function moveCard(cardId, fromListId, toListId, atIdx, pos) {
  const fromList = state.lists.find(l=>l.id===fromListId);
  const toList = state.lists.find(l=>l.id===toListId);
  if (!fromList || !toList) return;
  const cardIdx = fromList.cards.findIndex(c=>c.id===cardId);
  if (cardIdx<0) return;
  const [card] = fromList.cards.splice(cardIdx, 1);
  if (fromListId === toListId && atIdx !== null) {
    let insertIdx = atIdx;
    if (cardIdx < atIdx) insertIdx--;
    if (pos === 'bottom') insertIdx++;
    insertIdx = Math.max(0, Math.min(insertIdx, toList.cards.length));
    toList.cards.splice(insertIdx, 0, card);
  } else {
    let insertIdx = atIdx !== null ? atIdx : toList.cards.length;
    if (pos === 'bottom' && atIdx !== null) insertIdx++;
    insertIdx = Math.max(0, Math.min(insertIdx, toList.cards.length));
    toList.cards.splice(insertIdx, 0, card);
  }
}

render();
</script>
